help_main: "**Возможности TG iBot 👇:**\n\n"
help_coming_soon: "Инструкция скоро появится здесь 😎"
help_forward: |
  **Инструкция: Пересылка 📬**

  🔎 Хотите узнать ID пользователя или чата? Просто перешлите мне сообщение!

  1️⃣ Найдите любое сообщение в чате (пользователь, группа, канал или бот).
  2️⃣ Перешлите его мне в личку.
  3️⃣ Я мгновенно покажу ID, имя и другую информацию! ⚡

  💡 **Совет:** Работает с любым пересланным сообщением, даже из приватных чатов! 😎
help_getme: |
  **Инструкция: Мой профиль 🙋‍♂️**

  🔍 Хотите узнать свой Telegram ID? Это очень просто!

  1️⃣ Напишите `/me` в чате со мной.
  2️⃣ Я мгновенно отправлю ваш ID, имя и юзернейм! ⚡
  3️⃣ Если у вас есть фото профиля, я покажу его тоже! 📸

  💡 **Совет:** Используйте кнопку в ответе, чтобы скопировать ID! 😎
help_sharedchat: |
  **Инструкция: Поделиться чатом 🌐**

  🔎 Нужен ID пользователя, группы или канала? Поделитесь со мной!

  1️⃣ Напишите `/start`, чтобы увидеть кнопки.
  2️⃣ Нажмите 👤 Пользователь, 🤖 Бот, 👥 Группа или 📢 Канал и выберите чат.
  3️⃣ Я мгновенно получу ID, имя и юзернейм! ⚡

  💡 **Совет:** Работает для публичных и приватных чатов! 😎
help_admins: |
  **Инструкция: Админ-чаты 🛡️**

  🔍 Хотите узнать, где вы администратор? Я помогу!

  1️⃣ Откройте ⚙️ Настройки → 👑 Мои админ-чаты (или напишите `/admin`).
  2️⃣ Используйте кнопки, чтобы поделиться каналом или группой с правами админа.
  3️⃣ Я мгновенно покажу ID и детали! ⚡

  💡 **Совет:** Идеально для управления своими ролями администратора! 😎
help_ownchats: |
  **Инструкция: Мои чаты 📚**

  🔎 Хотите узнать о своих каналах или группах? Давайте найдём их!

  1️⃣ Откройте ⚙️ Настройки → 📚 Чаты создателя (или напишите `/my`).
  2️⃣ Используйте кнопки, чтобы поделиться своим каналом или группой.
  3️⃣ Я мгновенно отправлю ID и детали! ⚡

  💡 **Совет:** Отлично подходит для отслеживания своих чатов! 😎
help_username: |
  **Инструкция: По юзернейму 👤**

  🔎 Хотите узнать информацию о конкретном пользователе? Просто отправьте мне его юзернейм!

  1️⃣ Напишите юзернейм (например, `@username`) в чате со мной.
  2️⃣ Я мгновенно получу ID, имя и другие данные! ⚡
  3️⃣ Если есть фото профиля, я покажу его тоже! 📸

  💡 **Совет:** Работает для любого публичного юзернейма, даже ботов! 😎
