help_forward: |
  **Yo'naltirish bo'yicha qo'llanma 📬**

  🔎 Foydalanuvchi yoki chat ID'sini bilmoqchimisiz? Menga xabar yo'naltiring!

  1️⃣ Istalgan chatda xabar toping (foydalanuvchi, guruh, kanal yoki bot).
  2️⃣ Uni menga shaxsiy xabarda yo'naltiring.
  3️⃣ Men ID, ism va boshqa ma'lumotlarni darhol ko'rsataman! ⚡

  💡 **Maslahat:** Har qanday yo'naltirilgan xabar bilan ishlaydi, hatto shaxsiy chatlardan ham! 😎
help_getme: |
  **Mening profilim bo'yicha qo'llanma 🙋‍♂️**

  🔍 O'z Telegram ID'ingizni bilmoqchimisiz? Bu juda oddiy!

  1️⃣ Men bilan chatda `/me` yozing.
  2️⃣ Men ID, ism va username'ingizni darhol yuboraman! ⚡
  3️⃣ Profil rasmingiz bo'lsa, uni ham ko'rsataman! 📸

  💡 **Maslahat:** ID'ni nusxalash uchun javobdagi tugmadan foydalaning! 😎
help_sharedchat: |
  **Chat ulashish bo'yicha qo'llanma 🌐**

  🔎 Foydalanuvchi, guruh yoki kanal ID'si kerakmi? Menga ulashing!

  1️⃣ Tugmalarni ko'rish uchun `/start` yozing.
  2️⃣ Foydalanuvchi, bot, guruh yoki kanalni tanlang.
  3️⃣ Men ID, ism va username'ni darhol olaman! ⚡

  💡 **Maslahat:** Ochiq va yopiq chatlar, botlar va premium foydalanuvchilar uchun ishlaydi! 😎
help_admins: |
  **Admin chatlar bo'yicha qo'llanma 🛡️**

  🔍 Qayerlarda admin ekanligingizni bilmoqchimisiz?

  1️⃣ Men bilan chatda `/admin` yozing.
  2️⃣ Admin huquqlaringiz bor kanal yoki guruhni ulashish uchun tugmalardan foydalaning.
  3️⃣ Men ID va tafsilotlarni darhol ko'rsataman! ⚡

  💡 **Maslahat:** Admin rollaringizni boshqarish uchun ideal! 😎
help_ownchats: |
  **Mening chatlarim bo'yicha qo'llanma 📚**

  🔎 O'z kanallaringiz yoki guruhlaringiz haqida bilmoqchimisiz?

  1️⃣ Men bilan chatda `/my` yozing.
  2️⃣ O'z kanal yoki guruhingizni ulashish uchun tugmalardan foydalaning.
  3️⃣ Men ID va tafsilotlarni bir zumda yuboraman! ⚡

  💡 **Maslahat:** O'z chatlaringizni kuzatib borish uchun zo'r! 😎
help_username: |
  **Username bo'yicha qo'llanma 👤**

  🔎 Muayyan foydalanuvchi haqida ma'lumot kerakmi? Username'ini yuboring!

  1️⃣ Men bilan chatda username yozing (masalan, `@username`).
  2️⃣ Men ID, ism va boshqa ma'lumotlarni darhol olaman! ⚡
  3️⃣ Profil rasmi bo'lsa, uni ham ko'rsataman! 📸

  💡 **Maslahat:** Istalgan ochiq username uchun ishlaydi, hatto botlar ham! 😎
