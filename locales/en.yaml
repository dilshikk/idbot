help_forward: |
  **Forward Message Tutorial 📬**

  🔎 Want to grab the ID of a user or chat? Just forward a message to me! Here's how:

  1️⃣ Find a message in any chat (user, group, channel, or bot).
  2️⃣ Forward it to me privately.
  3️⃣ I'll instantly reveal the ID, name, and more! ⚡

  💡 **Pro Tip:** Works with any forwarded message, even from private chats! 😎
help_getme: |
  **Get Me Tutorial 🙋‍♂️**

  🔍 Want to know your own Telegram ID? It's super easy!

  1️⃣ Just type `/me` in the chat with me.
  2️⃣ I'll send your user ID, name, and username instantly! ⚡
  3️⃣ If you have a profile photo, I'll show it too! 📸

  💡 **Pro Tip:** Use the button in the reply to copy your ID! 😎
help_sharedchat: |
  **Shared Chat Tutorial 🌐**

  🔎 Need the ID of a user, group, or channel? Share it with me!

  1️⃣ Type `/start` to see the sharing buttons.
  2️⃣ Pick a user, bot, group, or channel to share.
  3️⃣ I'll fetch the ID, name, and username instantly! ⚡

  💡 **Pro Tip:** Works for public and private chats, plus bots and premium users! 😎
help_admins: |
  **Admins Tutorial 🛡️**

  🔍 Want to see where you're an admin? I've got you!

  1️⃣ Type `/admin` in the chat with me.
  2️⃣ Use the buttons to share a channel or group where you have admin rights.
  3️⃣ I'll reveal the ID and details instantly! ⚡

  💡 **Pro Tip:** Perfect for managing your admin roles! 😎
help_ownchats: |
  **Own Chats Tutorial 📚**

  🔎 Curious about your own channels or groups? Let's find them!

  1️⃣ Type `/my` in the chat with me.
  2️⃣ Use the buttons to share a channel or group you own.
  3️⃣ I'll send the ID and details in a snap! ⚡

  💡 **Pro Tip:** Great for keeping track of your own chats! 😎
help_username: |
  **Username Tutorial 👤**

  🔎 Want info about a specific user? Just send me their username!

  1️⃣ Type a username (e.g., `@username`) in the chat with me.
  2️⃣ I'll fetch their ID, name, and other details instantly! ⚡
  3️⃣ If they have a profile photo, I'll show it too! 📸

  💡 **Pro Tip:** Works for any public username, even bots! 😎
